# This should match the minimum supported Pixi version
#:schema https://pixi.prefix.dev/v0.71.0/schema/manifest/schema.json

[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.71.0"

[package.build.backend]
name = "pixi-build-python"
version = ">=0.6.0"
channels = ["conda-forge"]

[package.build.config]
ignore-pypi-mapping = true

[package.host-dependencies]
uv = ">=0.13.0,<0.14.0"

[package.run-dependencies]
anyio = ">=4.12.0,<5.0.0"
pooch = ">=1.9.0,<2.0.0"
py-rattler = ">=0.23.1,<2.0.0"
typing-extensions = ">=4.14.0,<5.0.0"
uvloop = { version = ">=0.22.1,<2.0.0", when = "__unix" }
winloop = { version = ">=0.3.1,<2.0.0", when = "__win" }

[dependencies]
jinja2 = ">=3.1.6"
pooch-rattler = { path = "." }
pyrefly = ">=1.3.2"
pytest = ">=8.4.2"
tqdm = ">=4.67.2"
trio = ">=0.31.0"
ty = ">=0.0.86"
types-tqdm = ">=4.67.2"

[pypi-dependencies]
bustapi = ">=0.9.2,!=0.13.0"

[environments]
# conda-forge has dropped support for Python 3.9
# Testing the minimum and maximum Python versions
default = ["py310"]
py315 = ["py315"]

[feature.py310.dependencies]
python-gil = "3.10.*"
ruff = ">=0.17.0"
tombi = ">=1.8.0"

[feature.py310.pypi-dependencies]
basedpyright = ">=1.40.2"

[feature.py315.dependencies]
basedpyright = ">=1.40.2"
python-gil = "3.15.*"

[tasks]
pytest = "pytest -Werror"
test = [
    { task = "pytest", environment = "default" },
    { task = "pytest", environment = "py315" },
]
