[build-system]
requires = ["uv-build >=0.13.4,<0.14.0"]
build-backend = "uv_build"

[project]
name = "pooch-rattler"
version = "0.4.0"
description = "Pooch downloader powered by Rattler"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
keywords = ["data", "download", "caching", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "anyio >=4.14.0,<5.0.0",
    "certifi >=2026.10.19",
    "pooch >=1.9.0,<2.0.0",
    "py-rattler >=0.28.0,<2.0.0",
    "typing-extensions >=4.16.0,<5.0.0",
    "uvloop >=0.22.1,<2.0.0; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
    "winloop >=0.3.1,<2.0.0; sys_platform == 'win32' and platform_python_implementation != 'PyPy'",
]

[dependency-groups]
dev = [
    "anyio[trio]",
    "basedpyright >=1.40.2",
    "bustapi >=0.15.0",
    "nodejs-wheel-binaries <=20.18.0; sys_platform == 'darwin' and platform_release < '20'",
    "nodejs-wheel-binaries <=22.20.0; sys_platform == 'darwin' and platform_release < '22'",
    "pyrefly >=1.4.0",
    "pytest >=9.1.1",
    "ruff >=0.17.2",
    "tombi >=1.9.3",
    "tqdm >=4.67.2",
    "ty >=0.0.91",
    "types-tqdm >=4.67.2",
]

[[project.authors]]
name = "hingebase"
email = "zcliu@pku.edu.cn"

[project.urls]
Homepage = "https://github.com/hingebase/pooch-rattler"
"Source Code" = "https://github.com/hingebase/pooch-rattler"
"Issue Tracker" = "https://github.com/hingebase/pooch-rattler/issues"

[tool.basedpyright]
failOnWarnings = true
reportUnnecessaryTypeIgnoreComment = "warning"
strict = ["."]
typeCheckingMode = "off"

[tool.pyrefly]
preset = "strict"

[tool.ruff]
line-length = 79
preview = true

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert", "implicit-namespace-package"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.tombi.lint.rules]
tables-out-of-order = "off"

[tool.ty.rules]
all = "error"
truthiness-test-of-none-union = "ignore"

[tool.uv]
required-version = ">=0.13.4"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
